<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - MyShop</title>

    <!-- Lien Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Lien vers le fichier CSS externe -->
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

    <header>
        <!-- Titre Principal -->
        <h1>My Shop</h1>
        <!-- Menu de navigation simple -->
        <nav >
            <ul class="menu">
                <li>
                    <a href="../index.html">Acceuil</a>
                </li>
                <li>
                    <a href="about.html">A propos</a>
                </li>
                <li>
                    <a href="products.html">Produits</a>
                </li>
                <li>
                    <a href="signup.html">Inscription</a>
                </li>
                <li>
                    <a href="login.html">Connexion</a>
                </li>
                <li>
                    <a href="cart.html">Panier<a>
                </li>
                <li>
                    <a href="contact.html">Contact</a>
                </li>
            </ul>
        </nav>
    </header>


    <main>
        <section>
            <h2 class="presentation">Mon Panier</h2>

            <table border="1">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Produit</th>
                        <th scope="col">Prix</th>
                        <th scope="col">Quantité</th>
                        <th scope="col">Total</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Chemise</td>
                        <td>20</td>
                        <td>1</td>
                        <td>20</td>
                        <td>
                            <button type="button">Supprimer</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Robe</td>
                        <td>15</td>
                        <td>2</td>
                        <td>30</td>
                        <td>
                            <button type="button">Supprimer</button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4">Total</td>
                        <td>50</td>
                        <td>
                            <button type="button">Commander</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2024 My Shop. Tous droits réservés.</p>
        <!-- liens vers : fb , instagram-->
        <a href="https://www.facebook.com/" target="_blank">
            <i class="fa-brands fa-facebook"></i> Facebook
        </a>
        <a href="https://www.instagram.com/" target="_blank">
            <i class="fa-brands fa-instagram"></i>Instagram
        </a>
     
        <!-- mailto : lien vers une adresse e-mail, il permet d'envoyer mail à cette adresse mail -->
        <a href="mailto:myshop@gmail.com">
            <i class="fa-solid fa-envelope"></i> myshop@gmail.com
        </a>

        <!-- tel : Lien vers un numéro de téléphone , il permet de lancer un appel vers ce num -->
        <a href="tel:123456789">
            <i class="fa-solid fa-phone"></i> 123456789
        </a>

        <!-- download : Télécharger automatiquement le pdf -->
        <!-- download="document.pdf : Télécharger le fichier en lui donnant ce nom -->
        <a href="assets/pdf/Mentions légales.pdf" download="document.pdf" >
            <i class="fa-solid fa-file-pdf"></i> Mentions Légales
        </a>
    </footer>
</body>

</html>
